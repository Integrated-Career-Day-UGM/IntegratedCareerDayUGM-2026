name: CI

# Fast path (development + staging): install -> verify -> build.
# Unit tests are KEPT below but are NOT composed: they only run when explicitly
# requested from the Actions "Run workflow" button. This repo currently has zero
# unit tests, so running them by default can only produce red builds for no signal.
#
# Playwright is intentionally NOT used in CI for now. Playwright lives only in
# playwright.config.ts + `bun run test:e2e` for local use.
#
# main is gated more strictly, outside this file:
#   - required status check: "CI passed"
#   - dependency-review (below, PRs only)
#   - CodeQL is disabled for now (codeql.yml is workflow_dispatch only)
#
# Bun is the only package manager here: `bun.lock` is the source of truth and
# `bun install --frozen-lockfile` replaces the old npm ci (which could never pass
# because package-lock.json was out of sync with package.json).

on:
  pull_request:
    branches: [main, staging, development]
  push:
    branches: [development, staging]
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: "Run Vitest (only enable once src/**/*.test.* exists)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  # Set the repo/org variable PUBLIC_APP_URL to the staging domain so the
  # sitemap and canonical URLs are not baked as localhost. Falls back when unset.
  PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'http://localhost:4321' }}

jobs:
  # Stage 1: one install, then every static check that actually exists today.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Generates .astro/types.d.ts so `tsc --noEmit` sees the same env types
      # that `astro check` does.
      - run: bunx astro sync
      - run: bun run check
      - run: bun run typecheck
      - run: bun run lint

  # Stage 2: production build. Mirrors what Vercel runs, so a green CI run means
  # the staging deploy will not fail on the build step.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Stage 3: dependency review on pull requests only. Needs no extra install.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------- routine kept,
  # not composed. Enable by adding test files, then dispatching with the input
  # `run_unit_tests: true` (or drop the `if:` once the suite is real).
  unit-test:
    name: Unit tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun install --frozen-lockfile
      # --passWithNoTests keeps this honest today: zero specs is not a failure.
      - run: bunx vitest run --passWithNoTests

  # Final gate: this is the single required status check for the main ruleset.
  # Skipped jobs are fine; only failure/cancelled fail the gate.
  ci-passed:
    name: CI passed
    if: always()
    needs: [verify, build, dependency-review, unit-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all stages
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "One or more stages failed."
            exit 1
          fi
          echo "All composed stages passed."
