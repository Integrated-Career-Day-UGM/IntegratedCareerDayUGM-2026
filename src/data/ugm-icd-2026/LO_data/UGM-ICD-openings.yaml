  - program: ANT'Z (Awe-inspiring Next Talent of Zurich)
    intake_count: null
    roles:
      - title: ANT'Z (Next Talent Program)
        location: All over Indonesia (global exposure challenges)
        job_desc_summary: "Talent program across business areas with global exposure and opportunities to grow within Zurich."
        qualification:
          - Minimum Bachelor degree with minimum GPA 3.25 from any discipline (last-semester students welcome with proof of provisional transcripts)
          - Adaptive, articulate, personable, strong analytical thinking, initiative, and business sense
          - Actively involved in organization or committee with passion for organization
          - Fluent and confident in English, both written and spoken
          - Willing to be placed all over in Indonesia
        preferences: []
  - program: General Hiring & HR Technology
    intake_count: null
    roles:
      - title: HR Technology - Zurich Topas Life (HRIS Specialist)
        location: Head Office Graha Zurich (Hybrid working)
        job_desc_summary: "Transform HR operations via data management, HRIS optimization, automation/AI workflows, reporting/analytics, process improvement, and workforce insights across HR & employee lifecycle."
        qualification:
          - Bachelor's degree in Information Systems, Computer Science, or related field (final-year students and fresh graduates welcome)
          - Strong knowledge of HR systems, data management, reporting, and HR processes
          - Experience building automation/digital workflows (e.g., Power Automate, Power Apps, AI tools) and proficient in MS Excel & HR analytics/reporting tools (e.g., Power BI)
          - Strong analytical, problem-solving, data interpretation, communication, stakeholder management, project coordination, and attention-to-detail skills
        preferences:
          - Experience in system developer, system enhancement, process improvement, and AI-enabled solutions is an advantage